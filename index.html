<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Башня из коробок пиццы</title>
  <!-- Подключаем Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-outer: #1e1612;
      --cream: #fff6ea;
      --warm-brown: #4a2e1b;
      --terracotta: #d95338;
      --terracotta-dark: #b33d25;
      --gold: #f5a623;
      --card-bg: rgba(255, 246, 234, 0.96);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-outer);
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: calc(100vh * (9 / 16));
      max-height: calc(100vw * (16 / 9));
      aspect-ratio: 9 / 16;
      background: #2c1e16;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 18px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
    }

    .hud-top-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background: rgba(45, 27, 16, 0.72);
      backdrop-filter: blur(4px);
      color: var(--cream);
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1.5px solid rgba(255, 224, 178, 0.25);
    }

    .coin-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd54f, #f59e0b);
      color: #5c3400;
      font-size: 11px;
      font-weight: 900;
      box-shadow: inset 0 -1px 0 rgba(0,0,0,0.2);
    }

    #sound-btn {
      pointer-events: auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 224, 178, 0.3);
      background: rgba(45, 27, 16, 0.75);
      color: var(--cream);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s;
    }

    #sound-btn:active {
      transform: scale(0.92);
    }

    #score-display {
      margin-top: 8px;
      font-family: 'Fredoka', sans-serif;
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      color: var(--cream);
      text-shadow: 0 4px 0 rgba(58, 32, 16, 0.65), 0 8px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s cubic-bezier(0.2, 1.5, 0.4, 1);
    }

    #score-display.bump {
      transform: scale(1.18);
    }

    .hud-substats {
      margin-top: 6px;
      display: flex;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #ffe4c4;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    #combo-pill {
      background: rgba(217, 83, 56, 0.9);
      padding: 2px 10px;
      border-radius: 999px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s, transform 0.2s;
    }

    #combo-pill.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #tap-hint {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 246, 234, 0.94);
      color: var(--warm-brown);
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      pointer-events: none;
      white-space: nowrap;
      animation: pulseHint 1.4s infinite ease-in-out;
      z-index: 4;
      transition: opacity 0.25s ease;
    }

    #tap-hint.hidden {
      opacity: 0;
    }

    @keyframes pulseHint {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.06); }
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(28, 17, 11, 0.62);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
      transition: opacity 0.25s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 310px;
      background: var(--card-bg);
      border-radius: 26px;
      padding: 28px 22px;
      text-align: center;
      color: var(--warm-brown);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45), inset 0 2px 0 #ffffff;
      border: 3px solid #e6ccb2;
    }

    .pizza-emblem {
      width: 72px;
      height: 72px;
      margin: 0 auto 12px;
      background: #f3c68f;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 6px 0 #c9965b;
      transform: rotate(-4deg);
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 28px;
      line-height: 1.15;
      color: var(--warm-brown);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.4;
      color: #7a5238;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }

    .stat-box {
      background: #f5e6d3;
      border-radius: 16px;
      padding: 10px 8px;
      border: 1.5px solid #e2cbb0;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 700;
      color: #8c6246;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .stat-value {
      font-family: 'Fredoka', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--warm-brown);
      margin-top: 2px;
    }

    .stat-box.full-width {
      grid-column: span 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
    }

    .btn {
      width: 100%;
      min-height: 54px;
      border: none;
      border-radius: 16px;
      font-family: 'Fredoka', sans-serif;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: translateY(3px);
    }

    .btn-primary {
      background: var(--terracotta);
      color: #fff;
      box-shadow: 0 5px 0 var(--terracotta-dark);
      margin-bottom: 12px;
    }

    .btn-primary:hover {
      filter: brightness(1.05);
    }

    .btn-secondary {
      background: #e8d5be;
      color: var(--warm-brown);
      box-shadow: 0 4px 0 #cbb294;
      font-size: 17px;
      min-height: 48px;
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-top-row">
      <div class="badge" title="Собранные монеты">
        <span class="coin-icon">₽</span>
        <span id="hud-coins">0</span>
      </div>
      <div class="badge" title="Высота башни">
        <span>📏 <span id="hud-height">0</span> см</span>
      </div>
      <button id="sound-btn" aria-label="Переключить звук" title="Звук">🔊</button>
    </div>

    <div id="score-display">0</div>

    <div class="hud-substats">
      <span id="combo-pill">🔥 Серия: <span id="hud-combo">0</span></span>
    </div>
  </div>

  <div id="tap-hint" class="hidden">👆 Тапни, чтобы поставить</div>

  <div id="menu-screen" class="overlay">
    <div class="card">
      <div class="pizza-emblem">🍕</div>
      <h1>Башня из коробок пиццы</h1>
      <p class="subtitle">Тапни вовремя, чтобы поставить коробку максимально ровно!</p>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Рекорд</div>
          <div class="stat-value" id="menu-best">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Всего монет</div>
          <div class="stat-value" id="menu-total-coins">0</div>
        </div>
      </div>

      <button id="start-btn" class="btn btn-primary">Играть</button>
    </div>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <div class="card">
      <div class="pizza-emblem">📦</div>
      <h1>Башня рухнула!</h1>
      <p class="subtitle" id="gameover-comment">Хорошая попытка, шеф!</p>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Счёт</div>
          <div class="stat-value" id="end-score">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Рекорд</div>
          <div class="stat-value" id="end-best">0</div>
        </div>
        <div class="stat-box full-width">
          <span class="stat-label">Монеты за раунд</span>
          <span class="stat-value" id="end-round-coins">+0</span>
        </div>
      </div>

      <button id="restart-btn" class="btn btn-primary">Ещё раз</button>
      <button id="menu-btn" class="btn btn-secondary">В меню</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) {
      tg.setHeaderColor('#2c1e16');
    }
  }

  const LOGIC_W = 360;
  const LOGIC_H = 640;
  const BOX_HEIGHT = 28;
  const INITIAL_BOX_WIDTH = 176;
  const MIN_BOX_WIDTH = 14;
  const BASE_Y = 540;
  const PERFECT_TOLERANCE = 6.5;
  const BASE_SPEED = 175;
  const MAX_SPEED = 460;
  const DROP_SPEED = 1150;
  const GRAVITY = 1350;

  const BOX_PALETTES = [
    { top: '#f5d2a4', front: '#dfae74', lid: '#c99355', tape: '#e8dec8', stamp: '#c84b31' },
    { top: '#edd0ab', front: '#d4a772', lid: '#bc8c56', tape: '#f0e6d2', stamp: '#2e7d32' },
    { top: '#f7dab2', front: '#e3b57d', lid: '#ca985c', tape: '#e5dac3', stamp: '#d95338' },
    { top: '#e6c396', front: '#cc9e68', lid: '#b3834c', tape: '#ede2cd', stamp: '#8d3b24' }
  ];

  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.enabled = localStorage.getItem('pizza_tower_sound') !== 'off';
    }

    init() {
      if (!this.ctx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          this.ctx = new AudioContext();
        }
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    toggle() {
      this.enabled = !this.enabled;
      localStorage.setItem('pizza_tower_sound', this.enabled ? 'on' : 'off');
      if (this.enabled) this.init();
      return this.enabled;
    }

    playPlace() {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.exponentialRampToValueAtTime(75, now + 0.09);
      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    playPerfect(combo) {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const pitchShift = Math.min(combo - 1, 8) * 35;
      const freqs = [523.25 + pitchShift, 659.25 + pitchShift, 783.99 + pitchShift];
      freqs.forEach((f, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now + idx * 0.035);
        gain.gain.setValueAtTime(0.001, now + idx * 0.035);
        gain.gain.linearRampToValueAtTime(0.18, now + idx * 0.035 + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.035 + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + idx * 0.035);
        osc.stop(now + idx * 0.035 + 0.3);
      });
    }

    playSlice() {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(280, now);
      osc.frequency.exponentialRampToValueAtTime(95, now + 0.18);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    }

    playGameOver() {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const notes = [330, 293.66, 261.63, 196];
      notes.forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.11);
        gain.gain.setValueAtTime(0.2, now + i * 0.11);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.11);
        osc.stop(now + i * 0.11 + 0.26);
      });
    }
  }

  const sound = new SoundEngine();

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const wrapper = document.getElementById('game-wrapper');

  const hudCoins = document.getElementById('hud-coins');
  const hudHeight = document.getElementById('hud-height');
  const hudCombo = document.getElementById('hud-combo');
  const comboPill = document.getElementById('combo-pill');
  const scoreDisplay = document.getElementById('score-display');
  const tapHint = document.getElementById('tap-hint');
  const soundBtn = document.getElementById('sound-btn');

  const menuScreen = document.getElementById('menu-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const menuBest = document.getElementById('menu-best');
  const menuTotalCoins = document.getElementById('menu-total-coins');
  const endScore = document.getElementById('end-score');
  const endBest = document.getElementById('end-best');
  const endRoundCoins = document.getElementById('end-round-coins');
  const gameoverComment = document.getElementById('gameover-comment');

  let bestScore = 0;
  let totalCoins = 0;

  function loadUserData(callback) {
    if (tg && tg.CloudStorage) {
      tg.CloudStorage.getItems(['pizza_best', 'pizza_coins'], (err, values) => {
        if (!err && values) {
          bestScore = parseInt(values['pizza_best'] || localStorage.getItem('pizza_tower_best') || '0', 10);
          totalCoins = parseInt(values['pizza_coins'] || localStorage.getItem('pizza_tower_coins') || '0', 10);
        } else {
          loadFallbackStorage();
        }
        if (callback) callback();
      });
    } else {
      loadFallbackStorage();
      if (callback) callback();
    }
  }

  function loadFallbackStorage() {
    bestScore = parseInt(localStorage.getItem('pizza_tower_best') || '0', 10);
    totalCoins = parseInt(localStorage.getItem('pizza_tower_coins') || '0', 10);
  }

  function saveUserData() {
    localStorage.setItem('pizza_tower_best', String(bestScore));
    localStorage.setItem('pizza_tower_coins', String(totalCoins));

    if (tg && tg.CloudStorage) {
      tg.CloudStorage.setItem('pizza_best', String(bestScore));
      tg.CloudStorage.setItem('pizza_coins', String(totalCoins));
    }
  }

  loadUserData(updateStorageUI);

  let gameState = 'MENU';
  let stack = [];
  let activeBox = null;
  let debris = [];
  let particles = [];
  let floatingTexts = [];

  let score = 0;
  let roundCoins = 0;
  let perfectStreak = 0;
  let nextDirection = 1;

  let cameraY = 0;
  let targetCameraY = 0;
  let shakeTime = 0;
  let shakeIntensity = 0;
  let flashAlpha = 0;
  let lastTime = 0;

  function resizeCanvas() {
    const rect = wrapper.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(canvas.width / LOGIC_W, 0, 0, canvas.height / LOGIC_H, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function triggerHaptic(type) {
    if (tg && tg.HapticFeedback) {
      if (type === 'light') tg.HapticFeedback.impactOccurred('light');
      else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
      else if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
      else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
    } else if (navigator.vibrate) {
      try { navigator.vibrate(type === 'error' ? [60, 40, 90] : 25); } catch (_) {}
    }
  }

  function updateSoundButton() {
    soundBtn.textContent = sound.enabled ? '🔊' : '🔇';
  }
  updateSoundButton();

  function updateStorageUI() {
    menuBest.textContent = bestScore;
    menuTotalCoins.textContent = totalCoins;
  }

  function updateHUD() {
    scoreDisplay.textContent = score;
    hudCoins.textContent = totalCoins;
    hudHeight.textContent = score * 4;

    if (perfectStreak > 0) {
      hudCombo.textContent = perfectStreak;
      comboPill.classList.add('visible');
    } else {
      comboPill.classList.remove('visible');
    }
  }

  function bumpScoreAnimation() {
    scoreDisplay.classList.remove('bump');
    void scoreDisplay.offsetWidth;
    scoreDisplay.classList.add('bump');
  }

  function addFloatingText(text, x, y, color = '#fff6ea', size = 20) {
    floatingTexts.push({ text, x, y, color, size, life: 1.0, vy: -55 });
  }

  function spawnPerfectParticles(x, y, width) {
    const count = 22;
    const colors = ['#ffd54f', '#ff7043', '#fff6ea', '#81c784'];
    for (let i = 0; i < count; i++) {
      const px = x + Math.random() * width;
      const angle = -Math.PI * Math.random();
      const speed = 70 + Math.random() * 160;
      particles.push({
        x: px, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 30,
        size: 3 + Math.random() * 4,
        color: colors[i % colors.length],
        life: 0.7 + Math.random() * 0.35
      });
    }
  }

  function initGame() {
    score = 0;
    roundCoins = 0;
    perfectStreak = 0;
    nextDirection = 1;
    debris = [];
    particles = [];
    floatingTexts = [];
    cameraY = 0;
    targetCameraY = 0;
    shakeTime = 0;
    flashAlpha = 0;

    stack = [{
      x: (LOGIC_W - INITIAL_BOX_WIDTH) / 2,
      y: BASE_Y,
      width: INITIAL_BOX_WIDTH,
      height: BOX_HEIGHT,
      paletteIndex: 0,
      hasTape: true,
      stampType: 0
    }];

    spawnNextBox();
    updateHUD();

    tapHint.classList.remove('hidden');
    menuScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    gameState = 'PLAYING';
  }

  function spawnNextBox() {
    const topBox = stack[stack.length - 1];
    const width = topBox.width;
    const y = topBox.y - BOX_HEIGHT;
    const speed = Math.min(BASE_SPEED + score * 6.5, MAX_SPEED);
    const dir = nextDirection;
    nextDirection *= -1;
    const startX = dir === 1 ? 8 : (LOGIC_W - width - 8);

    activeBox = {
      x: startX,
      y: y,
      width: width,
      height: BOX_HEIGHT,
      dir: dir,
      speed: speed,
      state: 'MOVING',
      vy: 0,
      targetY: y,
      paletteIndex: (score + 1) % BOX_PALETTES.length,
      hasTape: (score + 1) % 2 === 0,
      stampType: (score + 1) % 3
    };
  }

  function handleAction() {
    if (gameState !== 'PLAYING' || !activeBox) return;
    if (activeBox.state === 'MOVING') {
      sound.init();
      activeBox.state = 'DROPPING';
      activeBox.y -= 14;
      activeBox.vy = DROP_SPEED;
      tapHint.classList.add('hidden');
    }
  }

  function landActiveBox() {
    const topBox = stack[stack.length - 1];
    const curr = activeBox;
    curr.y = topBox.y - BOX_HEIGHT;

    const delta = curr.x - topBox.x;
    const absDelta = Math.abs(delta);

    if (absDelta >= topBox.width) {
      triggerGameOver(curr);
      return;
    }

    if (absDelta <= PERFECT_TOLERANCE) {
      curr.x = topBox.x;
      curr.width = topBox.width;
      perfectStreak += 1;
      score += 1;
      roundCoins += 2;
      totalCoins += 2;
      saveUserData();

      sound.playPerfect(perfectStreak);
      triggerHaptic('success');
      flashAlpha = 0.28;
      spawnPerfectParticles(curr.x, curr.y, curr.width);

      if (perfectStreak % 3 === 0 && curr.width < INITIAL_BOX_WIDTH) {
        const grow = Math.min(18, INITIAL_BOX_WIDTH - curr.width);
        curr.width += grow;
        curr.x = Math.max(12, Math.min(LOGIC_W - curr.width - 12, curr.x - grow / 2));
        addFloatingText('Идеально! +Ширина', curr.x + curr.width / 2, curr.y - 26, '#81c784', 18);
      } else {
        addFloatingText('Идеально! +2 🪙', curr.x + curr.width / 2, curr.y - 22, '#ffd54f', 19);
      }

      stack.push({
        x: curr.x, y: curr.y, width: curr.width, height: BOX_HEIGHT,
        paletteIndex: curr.paletteIndex, hasTape: curr.hasTape, stampType: curr.stampType
      });
    } else {
      perfectStreak = 0;
      const overlapWidth = topBox.width - absDelta;

      if (overlapWidth < MIN_BOX_WIDTH) {
        triggerGameOver(curr);
        return;
      }

      let newX, sliceX, sliceWidth, sliceDir;
      if (delta > 0) {
        newX = curr.x;
        sliceX = topBox.x + topBox.width;
        sliceWidth = delta;
        sliceDir = 1;
      } else {
        newX = topBox.x;
        sliceX = curr.x;
        sliceWidth = absDelta;
        sliceDir = -1;
      }

      debris.push({
        x: sliceX, y: curr.y, width: sliceWidth, height: BOX_HEIGHT,
        vx: sliceDir * (65 + Math.random() * 45),
        vy: -70, rotation: 0,
        vRot: sliceDir * (2.5 + Math.random() * 2),
        paletteIndex: curr.paletteIndex
      });

      sound.playPlace();
      sound.playSlice();
      triggerHaptic('medium');

      shakeTime = 0.22;
      shakeIntensity = Math.min(5, absDelta * 0.08);

      score += 1;
      roundCoins += 1;
      totalCoins += 1;
      saveUserData();

      addFloatingText('+1 🪙', newX + overlapWidth / 2, curr.y - 18, '#fff6ea', 16);

      stack.push({
        x: newX, y: curr.y, width: overlapWidth, height: BOX_HEIGHT,
        paletteIndex: curr.paletteIndex, hasTape: curr.hasTape, stampType: curr.stampType
      });
    }

    if (score > bestScore) {
      bestScore = score;
      saveUserData();
    }

    bumpScoreAnimation();
    updateHUD();

    const desiredScreenY = 390;
    const currentTopY = stack[stack.length - 1].y;
    if (currentTopY + targetCameraY < desiredScreenY) {
      targetCameraY = desiredScreenY - currentTopY;
    }

    spawnNextBox();
  }

  function triggerGameOver(missedBox) {
    gameState = 'GAMEOVER';
    activeBox = null;

    const topBox = stack[stack.length - 1];
    const dir = missedBox.x >= topBox.x ? 1 : -1;
    debris.push({
      x: missedBox.x, y: missedBox.y, width: missedBox.width, height: BOX_HEIGHT,
      vx: dir * 80, vy: 60, rotation: 0, vRot: dir * 3.2, paletteIndex: missedBox.paletteIndex
    });

    sound.playGameOver();
    triggerHaptic('error');
    shakeTime = 0.35;
    shakeIntensity = 7;

    endScore.textContent = score;
    endBest.textContent = bestScore;
    endRoundCoins.textContent = `+${roundCoins}`;

    if (score === 0) {
      gameoverComment.textContent = 'Первый блин комом! Попробуй ещё раз.';
    } else if (score >= bestScore && score > 3) {
      gameoverComment.textContent = 'Новый рекорд пиццерии! Потрясающе!';
    } else if (score >= 15) {
      gameoverComment.textContent = 'Небоскрёб из горячей пиццы!';
    } else {
      gameoverComment.textContent = 'Отличная башня! Сможешь выше?';
    }

    updateStorageUI();

    setTimeout(() => {
      if (gameState === 'GAMEOVER') {
        gameoverScreen.classList.remove('hidden');
      }
    }, 550);
  }

  function update(dt) {
    cameraY += (targetCameraY - cameraY) * Math.min(1, dt * 7.5);

    if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);
    if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 1.4);

    if (gameState === 'PLAYING' && activeBox) {
      if (activeBox.state === 'MOVING') {
        activeBox.x += activeBox.dir * activeBox.speed * dt;
        const minX = 6;
        const maxX = LOGIC_W - activeBox.width - 6;

        if (activeBox.x >= maxX) {
          activeBox.x = maxX;
          activeBox.dir = -1;
        } else if (activeBox.x <= minX) {
          activeBox.x = minX;
          activeBox.dir = 1;
        }
      } else if (activeBox.state === 'DROPPING') {
        activeBox.y += activeBox.vy * dt;
        if (activeBox.y >= activeBox.targetY) {
          landActiveBox();
        }
      }
    }

    for (let i = debris.length - 1; i >= 0; i--) {
      const d = debris[i];
      d.x += d.vx * dt;
      d.vy += GRAVITY * dt;
      d.y += d.vy * dt;
      d.rotation += d.vRot * dt;

      if (d.y + cameraY > LOGIC_H + 140) {
        debris.splice(i, 1);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.vy += GRAVITY * 0.45 * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y += ft.vy * dt;
      ft.life -= dt * 1.15;
      if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
  }

  function drawBackground() {
    const bgGrad = ctx.createLinearGradient(0, 0, 0, LOGIC_H);
    bgGrad.addColorStop(0, '#2a1b14');
    bgGrad.addColorStop(0.55, '#42291c');
    bgGrad.addColorStop(1, '#593622');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, LOGIC_W, LOGIC_H);

    const bgParallax = cameraY * 0.22;

    ctx.fillStyle = 'rgba(255, 224, 189, 0.035)';
    for (let row = 0; row < 16; row++) {
      const by = ((row * 48 + bgParallax) % (LOGIC_H + 48)) - 48;
      const offset = (row % 2) * 34;
      for (let col = -1; col < 6; col++) {
        ctx.fillRect(col * 68 + offset, by, 60, 20);
      }
    }

    const lampY = 54 + Math.min(cameraY * 0.08, 25);
    const glow = ctx.createRadialGradient(LOGIC_W / 2, lampY + 20, 10, LOGIC_W / 2, lampY + 90, 220);
    glow.addColorStop(0, 'rgba(255, 214, 140, 0.25)');
    glow.addColorStop(1, 'rgba(255, 214, 140, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, LOGIC_W, LOGIC_H);

    ctx.strokeStyle = '#1c110b';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(LOGIC_W / 2, 0);
    ctx.lineTo(LOGIC_W / 2, lampY);
    ctx.stroke();

    ctx.fillStyle = '#d95338';
    ctx.beginPath();
    ctx.arc(LOGIC_W / 2, lampY + 14, 24, Math.PI, 0);
    ctx.fill();

    ctx.fillStyle = '#ffe082';
    ctx.beginPath();
    ctx.arc(LOGIC_W / 2, lampY + 15, 8, 0, Math.PI);
    ctx.fill();

    const tableY = BASE_Y + BOX_HEIGHT + cameraY;
    if (tableY < LOGIC_H + 60) {
      ctx.fillStyle = '#361f12';
      ctx.fillRect(0, tableY, LOGIC_W, LOGIC_H - tableY + 60);

      ctx.fillStyle = '#7c4a2b';
      ctx.fillRect(0, tableY, LOGIC_W, 14);

      ctx.fillStyle = '#9c613b';
      ctx.fillRect(0, tableY, LOGIC_W, 4);
    }
  }

  function drawPizzaBox(box) {
    const pal = BOX_PALETTES[box.paletteIndex % BOX_PALETTES.length];
    const { x, y, width, height } = box;
    const lidH = 7;

    ctx.fillStyle = pal.front;
    ctx.beginPath();
    ctx.roundRect(x, y + 2, width, height - 2, 3);
    ctx.fill();

    ctx.fillStyle = 'rgba(60, 32, 12, 0.22)';
    ctx.fillRect(x + 1, y + lidH, width - 2, 3);

    ctx.fillStyle = pal.top;
    ctx.beginPath();
    ctx.roundRect(x - 1, y, width + 2, lidH, 2.5);
    ctx.fill();

    ctx.fillStyle = pal.lid;
    ctx.fillRect(x, y + lidH - 1.5, width, 1.5);

    if (box.hasTape && width > 34) {
      const tapeW = Math.min(18, width * 0.22);
      const tapeX = x + width * 0.22;
      ctx.fillStyle = pal.tape;
      ctx.fillRect(tapeX, y, tapeW, lidH + 6);
    }

    if (width > 54) {
      const cx = x + width / 2;
      const cy = y + lidH + (height - lidH) / 2 + 0.5;

      ctx.fillStyle = pal.stamp;
      ctx.beginPath();
      ctx.moveTo(cx - 7, cy - 4);
      ctx.lineTo(cx + 7, cy - 4);
      ctx.lineTo(cx, cy + 6);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#f5d2a4';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(cx - 6.5, cy - 4);
      ctx.lineTo(cx + 6.5, cy - 4);
      ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(74, 46, 27, 0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(x, y, width, height, 3);
    ctx.stroke();
  }

  function render() {
    ctx.clearRect(0, 0, LOGIC_W, LOGIC_H);
    drawBackground();

    ctx.save();
    let offsetX = 0;
    let offsetY = cameraY;
    if (shakeTime > 0) {
      offsetX += (Math.random() - 0.5) * 2 * shakeIntensity;
      offsetY += (Math.random() - 0.5) * 2 * shakeIntensity;
    }
    ctx.translate(offsetX, offsetY);

    for (let i = 0; i < stack.length; i++) {
      const box = stack[i];
      if (box.y + cameraY > LOGIC_H + 40) continue;
      drawPizzaBox(box);
    }

    if (activeBox) {
      drawPizzaBox(activeBox);
    }

    for (let i = 0; i < debris.length; i++) {
      const d = debris[i];
      ctx.save();
      ctx.translate(d.x + d.width / 2, d.y + d.height / 2);
      ctx.rotate(d.rotation);
      drawPizzaBox({
        x: -d.width / 2, y: -d.height / 2, width: d.width, height: d.height,
        paletteIndex: d.paletteIndex, hasTape: false
      });
      ctx.restore();
    }

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (let i = 0; i < floatingTexts.length; i++) {
      const ft = floatingTexts[i];
      ctx.globalAlpha = Math.max(0, ft.life);
      ctx.font = `800 ${ft.size}px 'Fredoka', 'Nunito', sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(42, 24, 12, 0.75)';
      ctx.fillText(ft.text, ft.x, ft.y + 2);
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255, 236, 179, ${flashAlpha})`;
      ctx.fillRect(0, 0, LOGIC_W, LOGIC_H);
    }
  }

  function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleAction();
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowDown') {
      e.preventDefault();
      if (gameState === 'PLAYING') {
        handleAction();
      } else if (gameState === 'MENU') {
        initGame();
      } else if (gameState === 'GAMEOVER' && !gameoverScreen.classList.contains('hidden')) {
        initGame();
      }
    }
  });

  document.getElementById('start-btn').addEventListener('click', () => {
    sound.init();
    initGame();
  });

  document.getElementById('restart-btn').addEventListener('click', () => {
    sound.init();
    initGame();
  });

  document.getElementById('menu-btn').addEventListener('click', () => {
    gameState = 'MENU';
    gameoverScreen.classList.add('hidden');
    tapHint.classList.add('hidden');
    updateStorageUI();
    menuScreen.classList.remove('hidden');
  });

  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    sound.toggle();
    updateSoundButton();
  });

  requestAnimationFrame(gameLoop);
})();
</script>
